<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playlist style map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#EEF1F4;--ink:#1A2230;--muted:#586374;--line:#D3DAE2;--tile-off:#D5DBE3;--panel:#FFFFFF;--focus:#2149C4;--shadow:rgba(26,34,48,.16);
  --display:"Syne","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --tile:15px;--gap:3px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;--bg:#12161C;--ink:#E8ECF2;--muted:#99A4B3;--line:#2A323D;--tile-off:#2A323D;--panel:#1A2028;--focus:#8AA5F0;--shadow:rgba(0,0,0,.45)}
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12161C;--ink:#E8ECF2;--muted:#99A4B3;--line:#2A323D;--tile-off:#2A323D;--panel:#1A2028;--focus:#8AA5F0;--shadow:rgba(0,0,0,.45)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none !important}

.page{max-width:1240px;margin:0 auto;padding:clamp(18px,3vw,36px) clamp(16px,4vw,40px) 96px}
body.has-tray .page{padding-bottom:250px}
body.dragging::after{content:"Drop an .xlsx file to preview it";position:fixed;inset:12px;border:2px dashed var(--ink);border-radius:14px;background:color-mix(in srgb,var(--bg) 88%,transparent);display:grid;place-items:center;font:700 1.4rem var(--display);z-index:50;pointer-events:none}

/* source bar */
.srcbar{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;margin-bottom:26px;color:var(--muted);font-size:.86rem}
.srcbar .acts{display:flex;gap:8px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:22px 40px;justify-content:space-between;align-items:flex-end}
h1{font:800 clamp(2.6rem,7.4vw,5.2rem)/.94 var(--display);letter-spacing:-.03em;margin:0}
.lede{max-width:54ch;color:var(--muted);margin:16px 0 0;font-size:1.06rem}
.seg{display:inline-flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel)}
.seg button{border:0;background:transparent;padding:8px 18px;border-radius:999px;font-weight:600;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg-wrap{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.9rem}

.notice{margin:26px 0 0;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.notice p{margin:0;max-width:80ch}

/* spectrum */
.spectrum{display:flex;gap:7px;height:58px;margin-top:36px}
.fgroup{display:flex;gap:2px;min-width:0}
.sseg{flex:1 1 0;min-width:3px;border:0;padding:0;background:var(--c);border-radius:2px;transition:opacity .18s}
.spectrum.filtering .sseg{opacity:.22}
.spectrum.filtering .sseg.match{opacity:1}
.fleg{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:12px}
.fitem{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;border-radius:999px;padding:5px 12px 5px 8px;font-size:.92rem}
.fitem:hover{border-color:var(--line)}
.fitem[aria-pressed="true"]{border-color:var(--ink)}
.fitem em{font-style:normal;color:var(--muted)}
.fsw{width:12px;height:12px;border-radius:3px;background:var(--c)}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 36px;margin-top:38px;padding-top:26px;border-top:1px solid var(--line)}
.m b{display:block;font:700 clamp(2rem,4.4vw,3rem)/1 var(--display);letter-spacing:-.02em}
.m span{display:block;margin-top:8px;color:var(--muted);font-size:.92rem;max-width:26ch}
.insight{max-width:72ch;margin:26px 0 0}

/* wall */
h2{font:700 clamp(1.4rem,2.6vw,1.9rem)/1.15 var(--display);letter-spacing:-.01em;margin:0}
.wallsec{margin-top:64px}
.key{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin:10px 0 18px;color:var(--muted);font-size:.9rem}
.key span{display:inline-flex;align-items:center;gap:8px}
.key i{display:block;width:13px;height:13px;border-radius:3px}
.key .solid{background:var(--ink)}
.key .hollow{box-shadow:inset 0 0 0 2px var(--ink)}
.frow{display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px 28px;padding:24px 0;border-top:1px solid var(--line)}
.fhead h3{font:700 1.2rem/1.2 var(--display);margin:0}
.fhead p{margin:5px 0 0;color:var(--muted);font-size:.9rem}
.clusters{display:flex;flex-wrap:wrap;gap:24px 32px;align-items:flex-start}
.cluster{display:flex;flex-direction:column;align-items:flex-start;gap:9px;transition:opacity .2s}
.wall.filtering .cluster{opacity:.2}
.wall.filtering .cluster.match{opacity:1}
.clabel{border:0;background:transparent;padding:0;text-align:left;font-weight:600;font-size:.86rem;line-height:1.25;max-width:11.5rem}
.clabel span{color:var(--muted);font-weight:500;margin-left:4px}
.clabel:hover{text-decoration:underline;text-underline-offset:3px}
.tiles{display:grid;grid-template-columns:repeat(var(--cols),var(--tile));gap:var(--gap)}
.tile{display:block;width:var(--tile);height:var(--tile);border-radius:3px;background:var(--tile-off);cursor:pointer;
  transition:background-color .6s ease var(--d,0ms),box-shadow .6s ease var(--d,0ms)}
.wall.on .tile{background:var(--c)}
.wall.on .tile.guess{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.tile:hover{outline:2px solid var(--ink);outline-offset:1px}

/* explorer */
.explorer{margin-top:56px;scroll-margin-top:20px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.filters input,.filters select{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:9px 12px;min-width:0}
.filters input{flex:1 1 220px;max-width:340px}
.count{margin:14px 0 0;color:var(--muted);font-size:.9rem}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-weight:600;border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
th button{width:100%;text-align:left;border:0;background:transparent;padding:11px 14px;font-weight:600}
th button:hover{background:var(--bg)}
td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{color:var(--muted);font-variant-numeric:tabular-nums;width:1%}
td.ttl,td.art{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.art{max-width:220px}
td.sty,td.cert{white-space:nowrap}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--c);margin-right:8px;vertical-align:-1px}
.sw.guess{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.empty{padding:28px 16px;color:var(--muted)}
.more{margin-top:14px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 15px;font-weight:600;font-size:.92rem}
.btn.sm{padding:6px 12px;font-size:.84rem}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* about */
.about{margin-top:64px;padding-top:28px;border-top:1px solid var(--line)}
.about .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 36px;margin-top:16px;color:var(--muted)}
.about p{margin:0}

/* gate (no data yet) */
.gate{max-width:640px;margin:14vh auto 0;padding:0 4px}
.gate h1{font-size:clamp(2rem,5vw,3.2rem)}
.gate p{color:var(--muted);margin:16px 0}
.gate code{font:500 .9em ui-monospace,Menlo,Consolas,monospace;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 6px}

/* tray */
.tray{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(1180px,calc(100% - 24px));z-index:20;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 10px 34px var(--shadow);
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px 20px;align-items:center}
.tsw{width:44px;height:44px;border-radius:6px;background:var(--c)}
.tray h3{font:700 1.2rem/1.2 var(--display);margin:0}
.tray p{margin:3px 0 0;color:var(--muted);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.82rem}
.chip b{font-weight:600;margin-left:4px;color:var(--muted)}
.tact{display:flex;gap:8px}

/* tooltip */
.tip{position:fixed;z-index:30;pointer-events:none;max-width:290px;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:8px;font-size:.85rem;line-height:1.35;box-shadow:0 6px 20px var(--shadow);overflow-wrap:anywhere}
.tip .tm{opacity:.72}
.tip .tl{display:flex;align-items:center;gap:7px;margin-top:6px}
.tip .tl i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);flex:none}

@media (max-width:900px){
  .frow{grid-template-columns:minmax(0,1fr)}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .about .cols{grid-template-columns:minmax(0,1fr)}
  .tray{grid-template-columns:auto minmax(0,1fr)}
  .tact{grid-column:1 / -1}
  body.has-tray .page{padding-bottom:330px}
}
@media (max-width:640px){
  :root{--tile:13px;--gap:3px}
  .hide-s{display:none !important}
  .spectrum{height:44px}
}
@media (prefers-reduced-motion:reduce){
  .tile,.cluster,.sseg{transition:none !important}
}
</style>
</head>
<body>
<div class="page">
  <div class="srcbar">
    <span id="status" role="status" aria-live="polite">Loading the playlist…</span>
    <span class="acts">
      <button type="button" class="btn sm" id="reload">Reload</button>
      <button type="button" class="btn sm" id="openFile">Open an Excel file</button>
      <input type="file" id="fileIn" accept=".xlsx,.xlsm,.xls,.csv" hidden>
    </span>
  </div>

  <section class="gate" id="gate" hidden>
    <h1 id="gateH">Playlist style map</h1>
    <p id="gateMsg"></p>
    <button type="button" class="btn primary" id="gateOpen">Open an Excel file</button>
  </section>

  <main id="app" hidden>
    <header class="top">
      <div>
        <h1 id="h1">Playlist style map</h1>
        <p class="lede" id="lede"></p>
      </div>
      <div class="seg-wrap">
        <span id="countby">Count by</span>
        <div class="seg" role="group" aria-labelledby="countby">
          <button type="button" data-unit="tracks" aria-pressed="true">Tracks</button>
          <button type="button" data-unit="artists" aria-pressed="false">Artists</button>
        </div>
      </div>
    </header>

    <div class="notice" id="notice" hidden>
      <p id="noticeTxt"></p>
      <button type="button" class="btn sm" id="noticeBtn" hidden>Show them</button>
    </div>

    <section aria-label="Share of the playlist by style">
      <div class="spectrum" id="spectrum"></div>
      <div class="fleg" id="fleg"></div>
    </section>

    <section class="metrics" id="metrics" aria-label="Diversity measures"></section>
    <p class="insight" id="insight"></p>

    <section class="wallsec">
      <h2 id="wallh">Every track, grouped by style</h2>
      <p class="key"><span><i class="solid"></i>Confident or likely</span><span><i class="hollow"></i>Best guess</span></p>
      <div class="wall" id="wall" role="group" aria-label="Playlist grouped by style"></div>
    </section>

    <section class="explorer" id="explorer">
      <h2>Browse the tracks</h2>
      <div class="filters">
        <input type="search" id="q" placeholder="Search title, artist or album" aria-label="Search tracks">
        <select id="fFam" aria-label="Family"></select>
        <select id="fSty" aria-label="Style"></select>
        <select id="fVer" aria-label="Version"></select>
        <select id="fConf" aria-label="Certainty"></select>
      </div>
      <p class="count" id="count" aria-live="polite"></p>
      <div class="tablewrap">
        <table>
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="more" id="more"></div>
    </section>

    <section class="about">
      <h2>How this page works</h2>
      <div class="cols">
        <p id="ab1"></p>
        <p id="ab2"></p>
        <p id="ab3"></p>
      </div>
    </section>
  </main>
</div>

<aside class="tray" id="tray" hidden aria-live="polite">
  <span class="tsw" id="tsw"></span>
  <div>
    <h3 id="tname"></h3>
    <p id="tdesc"></p>
    <p id="tstats"></p>
    <div class="chips" id="tchips"></div>
  </div>
  <div class="tact">
    <button type="button" class="btn primary" id="tgo">See these tracks</button>
    <button type="button" class="btn" id="tclear">Clear</button>
  </div>
</aside>
<div class="tip" id="tip" hidden role="tooltip"></div>

<script src="vendor/xlsx.mini.min.js"></script>

    '<div class="m"><b>'+d.S+'</b><span>styles across '+Object.keys(famsUsed).length+' famil'+(Object.keys(famsUsed).length===1?'y':'ies')+'</span></div>'+
    '<div class="m"><b>'+d.eff.toFixed(1)+'</b><span>effective styles: how many equal-sized styles would spread the playlist as evenly</span></div>'+
    '<div class="m"><b>'+pct(c[top],d.N)+'%</b><span>'+esc(styles[top].name)+', the largest style</span></div>'+
    '<div class="m"><b>'+edits+'</b><span>tracks are sped-up or slowed edits</span></div>';
  var dT = diversity(classified(countsT)), dA = diversity(classified(countsA)), ta = topArtist();
  $('insight').textContent = state.unit==='tracks'
    ? 'Counting each artist once instead of each track '+(dA.eff>=dT.eff?'lifts':'lowers')+' the effective number of styles from '+dT.eff.toFixed(1)+' to '+dA.eff.toFixed(1)+'. '+ta.name+' alone supplies '+ta.n+' of the '+tracks.length+' tracks.'
    : 'Counting every track instead of each artist once '+(dT.eff>=dA.eff?'lifts':'lowers')+' the effective number of styles from '+dA.eff.toFixed(1)+' to '+dT.eff.toFixed(1)+'. '+ta.name+' alone supplies '+ta.n+' of the '+tracks.length+' tracks.';
}
function renderNotice(){
  var n = $('notice');
  if(meta.unclassified>0){
    $('noticeTxt').textContent = meta.unclassified+' track'+(meta.unclassified===1?' has':'s have')+' no style yet and '+(meta.unclassified===1?'shows':'show')+' in grey, outside the diversity measures. Add a Style for them in '+DATA_FILE+'.';
    $('noticeBtn').hidden = false; n.hidden = false;
  } else if(meta.inferred>0){
    $('noticeTxt').textContent = meta.inferred+' track'+(meta.inferred===1?' has':'s have')+' no Style in the file, so the style was matched from artists already known. Fill in the Style column to make it official.';
    $('noticeBtn').hidden = true; n.hidden = false;
  } else n.hidden = true;
}

/* ================= family ordering shared by spectrum and wall ================= */
function famOrder(){
  var c = counts();
  var arr = fams.map(function(f,fi){
    var sts = [], n = 0;
    styles.forEach(function(s,si){ if(s.fam===fi && c[si]>0){sts.push(si); n+=c[si];} });
    sts.sort(function(a,b){return c[b]-c[a];});
    return {fi:fi, n:n, styles:sts};
  }).filter(function(f){return f.n>0;});
  var uf = styles[U].fam;
  arr.sort(function(a,b){ if(a.fi===uf) return 1; if(b.fi===uf) return -1; return b.n-a.n; });
  return arr;
}

/* ================= spectrum ================= */
function renderSpectrum(){
  var c = counts(), N = c.reduce(function(a,b){return a+b;},0), fo = famOrder();
  $('spectrum').innerHTML = fo.map(function(f){
    return '<div class="fgroup" style="flex:'+f.n+' 1 0">'+f.styles.map(function(si){
      return '<button type="button" class="sseg" data-s="'+si+'" style="flex:'+c[si]+' 1 0;--c:var(--s'+si+')" aria-label="'+esc(styles[si].name)+': '+c[si]+' '+unitWord()+'"></button>';
    }).join('')+'</div>';
  }).join('');
  $('fleg').innerHTML = fo.map(function(f){
    return '<button type="button" class="fitem" data-f="'+f.fi+'" aria-pressed="'+(state.fam===f.fi)+'"><span class="fsw" style="--c:var(--s'+f.styles[0]+')"></span>'+esc(fams[f.fi])+' <em>'+pctS(f.n,N)+'%</em></button>';
  }).join('');
}

/* ================= wall ================= */
function renderWall(first){
  cur = state.unit==='tracks' ? trackUnits : artistUnits;
  var c = counts(), N = c.reduce(function(a,b){return a+b;},0), fo = famOrder();
  var per = styles.map(function(){return [];});
  cur.forEach(function(u,idx){u.idx = idx; per[u.s].push(u);});
  var html = '', k = 0;
  fo.forEach(function(f){
    html += '<section class="frow"><div class="fhead"><h3>'+esc(fams[f.fi])+'</h3><p>'+f.n+' '+unitWord()+' ('+pctS(f.n,N)+'%)</p></div><div class="clusters">';
    f.styles.forEach(function(si){
      var arr = per[si].slice();
      if(state.unit==='tracks') arr.sort(function(a,b){return a.track.p<b.track.p?-1:a.track.p>b.track.p?1:a.track.i-b.track.i;});
      else arr.sort(function(a,b){return b.n-a.n || (a.name<b.name?-1:1);});
      var cols = Math.min(arr.length, Math.max(2, Math.ceil(Math.sqrt(arr.length)*1.7)));
      html += '<div class="cluster" data-s="'+si+'"><button type="button" class="clabel" data-s="'+si+'">'+esc(styles[si].name)+'<span>'+arr.length+'</span></button><div class="tiles" aria-hidden="true" style="--cols:'+cols+'">';
      arr.forEach(function(u,ti){
        var d = first && !reduce ? Math.min(k*55+ti*4, 2600) : 0;
        html += '<i class="tile'+(u.guess?' guess':'')+'" data-s="'+si+'" data-n="'+u.idx+'" style="--c:var(--s'+si+');--d:'+d+'ms"></i>';
      });
      html += '</div></div>'; k++;
    });
    html += '</div></section>';
  });
  var wall = $('wall');
  wall.innerHTML = html;
  if(first && !reduce){
    wall.classList.remove('on');
    requestAnimationFrame(function(){requestAnimationFrame(function(){wall.classList.add('on');});});
  } else wall.classList.add('on');
  applyDim();
}
function applyDim(){
  var filtering = state.style!==null || state.fam!==null;
  function match(si){return (state.style===null || state.style===si) && (state.fam===null || styles[si].fam===state.fam);}
  $('wall').classList.toggle('filtering', filtering);
  $('spectrum').classList.toggle('filtering', filtering);
  document.querySelectorAll('.cluster').forEach(function(el){el.classList.toggle('match', match(+el.dataset.s));});
  document.querySelectorAll('.sseg').forEach(function(el){el.classList.toggle('match', match(+el.dataset.s));});
  document.querySelectorAll('.fitem').forEach(function(el){el.setAttribute('aria-pressed', String(state.fam===+el.dataset.f));});
}

/* ================= tooltip ================= */
var tip = $('tip');
function showTip(html, x, y){
  tip.innerHTML = html; tip.hidden = false;
  var r = tip.getBoundingClientRect(), pad = 14, l = x+pad, t = y+pad;
  if(l+r.width > window.innerWidth-8) l = x-r.width-pad;
  if(t+r.height > window.innerHeight-8) t = y-r.height-pad;
  tip.style.left = Math.max(8,l)+'px'; tip.style.top = Math.max(8,t)+'px';
}
function hideTip(){tip.hidden = true;}
function certLabel(t){return CONF[t.c] + ((t.src==='track'||t.src==='artist') ? ' (inferred)' : '');}
function tileHtml(el){
  var u = cur[+el.dataset.n]; if(!u) return '';
  var st = styles[u.s], sw = '<div class="tl" style="--c:var(--s'+u.s+')"><i></i>'+esc(st.name)+'</div>';
  if(state.unit==='tracks'){
    var t = u.track;
    return '<strong>'+esc(t.t)+'</strong><br>'+esc(t.a)+'<br><span class="tm">'+esc(t.al)+'</span>'+sw+
      '<span class="tm">'+certLabel(t)+(t.v!=='Original'?', '+t.v.toLowerCase():'')+'</span>';
  }
  var titles = u.tracks.slice(0,3).map(function(t){return t.t;}).join(', ') + (u.n>3?'…':'');
  return '<strong>'+esc(u.name)+'</strong><br>'+u.n+' track'+(u.n>1?'s':'')+sw+'<span class="tm">'+esc(titles)+'</span>';
}
function segHtml(si){
  var c = counts(), N = c.reduce(function(a,b){return a+b;},0), st = styles[si];
  return '<strong>'+esc(st.name)+'</strong><br><span class="tm">'+esc(fams[st.fam])+'</span><div class="tl" style="--c:var(--s'+si+')"><i></i>'+c[si]+' '+unitWord()+' ('+pctS(c[si],N)+'%)</div>';
}

/* ================= selection ================= */
function setStyle(si){state.style = si; state.fam = null; state.shown = 60; refreshSelection();}
function toggleStyle(si){setStyle(state.style===si ? null : si);}
function toggleFam(fi){state.fam = state.fam===fi ? null : fi; state.style = null; state.shown = 60; refreshSelection();}
function refreshSelection(){applyDim(); renderTray(); syncFilters(); renderTable();}

function renderTray(){
  var tray = $('tray');
  if(state.style===null){tray.hidden = true; document.body.classList.remove('has-tray'); return;}
  var si = state.style, st = styles[si];
  var ts = tracks.filter(function(t){return t.s===si;});
  var aus = artistUnits.filter(function(u){return u.s===si;});
  var guesses = ts.filter(function(t){return t.c===2;}).length;
  var cnt = {}; ts.forEach(function(t){cnt[t.p]=(cnt[t.p]||0)+1;});
  var top = Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a] || (a<b?-1:1);}).slice(0,6);
  $('tsw').style.setProperty('--c','var(--s'+si+')');
  $('tname').textContent = st.name;
  $('tdesc').textContent = (fams[st.fam] + (st.desc ? '. '+st.desc : ''));
  $('tstats').textContent = ts.length+' track'+(ts.length===1?'':'s')+' ('+pct(ts.length,tracks.length)+'% of the playlist) by '+aus.length+' artist'+(aus.length===1?'':'s')+
    (guesses? ', '+guesses+' filed as best guesses':'')+'.';
  $('tchips').innerHTML = top.map(function(a){return '<span class="chip">'+esc(a)+'<b>'+cnt[a]+'</b></span>';}).join('');
  tray.hidden = false; document.body.classList.add('has-tray');
}

/* ================= explorer ================= */
function buildFilters(){
  var c = countsT;
  var famHas = {}; styles.forEach(function(s,i){if(c[i]>0) famHas[s.fam]=1;});
  $('fFam').innerHTML = '<option value="all">All families</option>'+fams.map(function(f,i){return famHas[i]?'<option value="'+i+'">'+esc(f)+'</option>':'';}).join('');
  var so = '<option value="all">All styles</option>';
  fams.forEach(function(f,fi){
    if(!famHas[fi]) return;
    so += '<optgroup label="'+esc(f)+'">'+styles.map(function(s,si){return (s.fam===fi && c[si]>0)?'<option value="'+si+'">'+esc(s.name)+'</option>':'';}).join('')+'</optgroup>';
  });
  $('fSty').innerHTML = so;
  $('fVer').innerHTML = '<option value="all">All versions</option>'+VERS.map(function(v){return '<option>'+v+'</option>';}).join('');
  $('fConf').innerHTML = '<option value="all">Any certainty</option>'+CONF.map(function(c,i){return '<option value="'+i+'">'+c+'</option>';}).join('');
  $('fVer').value = state.ver; $('fConf').value = state.conf;
}
function syncFilters(){
  $('fFam').value = state.fam===null ? 'all' : String(state.fam);
  $('fSty').value = state.style===null ? 'all' : String(state.style);
}
function filtered(){
  var q = state.q.trim().toLowerCase();
  var rows = tracks.filter(function(t){
    return (state.style===null || t.s===state.style) && (state.fam===null || styles[t.s].fam===state.fam) &&
      (state.ver==='all' || t.v===state.ver) && (state.conf==='all' || t.c===+state.conf) &&
      (!q || (t.t+' '+t.a+' '+t.al).toLowerCase().indexOf(q)>-1);
  });
  if(state.sortKey){
    var k = state.sortKey, dir = state.sortDir;
    var val = function(t){return k==='s' ? styles[t.s].name : k==='c' ? t.c : k==='v' ? t.v : k==='a' ? t.a.toLowerCase() : t.t.toLowerCase();};
    rows = rows.slice().sort(function(x,y){var a=val(x), b=val(y); return (a<b?-1:a>b?1:x.i-y.i)*dir;});
  }
  return rows;
}
var COLS = [['i','#','hide-s'],['t','Title',''],['a','Artist',''],['s','Style',''],['v','Version','hide-s'],['c','Certainty','']];
function renderHead(){
  $('thead').innerHTML = COLS.map(function(c){
    var active = state.sortKey===c[0], arrow = active ? (state.sortDir===1?' ↑':' ↓') : '';
    var aria = active ? (state.sortDir===1?'ascending':'descending') : 'none';
    var inner = c[0]==='i' ? c[1] : '<button type="button" data-k="'+c[0]+'">'+c[1]+arrow+'</button>';
    return '<th class="'+c[2]+'" aria-sort="'+aria+'">'+inner+'</th>';
  }).join('');
}
function renderTable(){
  var rows = filtered(), shown = rows.slice(0, state.shown);
  $('count').textContent = rows.length===tracks.length ? 'All '+rows.length+' tracks' : rows.length+' of '+tracks.length+' tracks match';
  $('tbody').innerHTML = shown.length ? shown.map(function(t){
    return '<tr><td class="num hide-s">'+(t.i+1)+'</td><td class="ttl" title="'+esc(t.t)+'">'+esc(t.t)+'</td><td class="art" title="'+esc(t.a)+'">'+esc(t.a)+'</td>'+
      '<td class="sty"><span class="sw'+(t.c===2?' guess':'')+'" style="--c:var(--s'+t.s+')"></span>'+esc(styles[t.s].name)+'</td>'+
      '<td class="hide-s">'+t.v+'</td><td class="cert">'+certLabel(t)+'</td></tr>';
  }).join('') : '<tr><td colspan="6" class="empty">No tracks match these filters. Clear the search or pick another style.</td></tr>';
  $('more').innerHTML = rows.length>shown.length ? '<button type="button" class="btn" id="moreBtn">Show '+Math.min(60, rows.length-shown.length)+' more</button>' : '';
}

/* ================= about ================= */
function renderAbout(){
  var c = [0,0,0,0]; tracks.forEach(function(t){c[t.c]++;});
  $('ab1').textContent = 'Every number here is computed in your browser from '+DATA_FILE+', the Excel file next to this page. Each track has one Style. '+
    c[0]+' are marked confident, '+c[1]+' likely and '+c[2]+' best guesses (hollow squares).'+
    (meta.inferred? ' '+meta.inferred+' had no Style in the file and were matched from artists already known.' : '');
  $('ab2').textContent = 'Remixes are filed by how they sound, and sped-up or slowed edits stay with the style of the song underneath. When you count artists, each one appears once, in the style where most of their tracks fall, and a collaboration counts for the first credited artist.';
  $('ab3').textContent = 'Change a Style, add rows or add a new style in the Styles sheet, then replace the file on GitHub. This page checks for a new version every '+Math.round(POLL_MS/1000)+' seconds and redraws itself.'+
    (meta.dupes? ' '+meta.dupes+' rows repeat a track already in the list and are counted each time.' : '')+
    (meta.swapped? ' '+meta.swapped+' rows had artist and album swapped and were corrected.' : '');
}

/* ================= loading ================= */
var source = 'site', lastHash = null, lastChange = null, lastCheck = null;
function clock(d){return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});}
function hashBuf(buf){var h = 2166136261, a = new Uint8Array(buf); for(var i=0;i<a.length;i++){h ^= a[i]; h = Math.imul(h,16777619);} return (h>>>0)+':'+a.length;}
function setStatus(){
  var s = $('status');
  if(source!=='site') s.textContent = 'Preview of ' + source + ': ' + tracks.length + ' tracks. Reload to go back to ' + DATA_FILE + '.';
  else s.textContent = DATA_FILE + ': ' + tracks.length + ' tracks. Checked ' + clock(lastCheck) + (lastChange ? ', last change ' + clock(lastChange) : '') + '.';
}
function showGate(msg){
  $('app').hidden = true; $('gate').hidden = false; $('gateMsg').innerHTML = msg;
  $('tray').hidden = true; document.body.classList.remove('has-tray');
}
function apply(buf, first){
  if(typeof XLSX==='undefined') throw new Error('The Excel reader (vendor/xlsx.mini.min.js) did not load.');
  var wb = XLSX.read(buf, {type:'array'}), parsed = parseWorkbook(wb);
  if(!parsed.rows.length) throw new Error('No tracks found in the first sheet.');
  var prevStyle = state.style!==null && styles[state.style] ? styles[state.style].name : null;
  var prevFam = state.fam!==null && fams[state.fam] ? fams[state.fam] : null;
  ingest(parsed);
  state.style = null; state.fam = null;
  if(prevStyle){ for(var i=0;i<styles.length;i++) if(styles[i].name===prevStyle && countsT[i]>0) state.style = i; }
  else if(prevFam){ var fi = fams.indexOf(prevFam); if(fi>-1) state.fam = fi; }
  state.shown = Math.max(60, state.shown);
  $('gate').hidden = true; $('app').hidden = false;
  renderAbout(); buildFilters(); renderHead(); renderAll(first); syncFilters(); renderTable();
}
function renderAll(first){renderHeader(); renderNotice(); renderSpectrum(); renderMetrics(); renderWall(first); renderTray();}

var firstDraw = true;
function fetchData(manual){
  source = 'site';
  var url = DATA_FILE + (DATA_FILE.indexOf('?')>-1 ? '&' : '?') + 't=' + Date.now();
  return fetch(url, {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.arrayBuffer();
  }).then(function(buf){
    lastCheck = new Date();
    var h = hashBuf(buf);
    if(h===lastHash && !manual){ setStatus(); return; }
    var changed = lastHash!==null && h!==lastHash;
    lastHash = h;
    try{ apply(buf, firstDraw); } catch(e){ e.isParse = true; throw e; }
    firstDraw = false;
    if(changed || lastChange===null) lastChange = lastCheck;
    setStatus();
  }).catch(function(err){
    if(tracks.length){
      $('status').textContent = err.isParse
        ? 'The latest '+DATA_FILE+' has a problem ('+err.message+'). Showing the last data I could read.'
        : 'Could not reach '+DATA_FILE+' at '+clock(new Date())+'. Showing the last data I have.';
      return;
    }
    if(err.isParse){ showGate('Could not read <code>'+esc(DATA_FILE)+'</code>: '+esc(err.message)); $('status').textContent = 'No data loaded.'; return; }
    var local = location.protocol==='file:';
    showGate((local
      ? 'Browsers block a page opened from your disk from reading files next to it. Open the Excel file below, or serve this folder (for example with <code>python -m http.server</code>) or publish it on GitHub Pages.'
      : 'Could not load <code>'+esc(DATA_FILE)+'</code> ('+esc(err.message)+'). Check that the file sits next to <code>index.html</code>, or open a file from your computer.'));
    $('status').textContent = 'No data loaded.';
  });
}
function openLocal(file){
  var fr = new FileReader();
  fr.onload = function(){
    try{
      source = file.name; apply(fr.result, firstDraw); firstDraw = false; lastHash = null; setStatus();
    } catch(err){ $('status').textContent = 'Could not read '+file.name+': '+err.message; if(!tracks.length) showGate('Could not read <code>'+esc(file.name)+'</code>: '+esc(err.message)); }
  };
  fr.readAsArrayBuffer(file);
}

/* ================= events ================= */
function wire(){
  document.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click', function(){
      if(state.unit===b.dataset.unit) return;
      state.unit = b.dataset.unit; hideTip(); renderAll(false);
    });
  });
  var wall = $('wall');
  wall.addEventListener('pointermove', function(e){
    var tile = e.target.closest('.tile');
    if(tile && e.pointerType!=='touch') showTip(tileHtml(tile), e.clientX, e.clientY); else if(!tile) hideTip();
  });
  wall.addEventListener('pointerleave', hideTip);
  wall.addEventListener('click', function(e){
    var tile = e.target.closest('.tile'), lab = e.target.closest('.clabel');
    if(lab){toggleStyle(+lab.dataset.s); return;}
    if(tile){
      if(state.style!==+tile.dataset.s) setStyle(+tile.dataset.s);
      var r = tile.getBoundingClientRect(); showTip(tileHtml(tile), r.left, r.bottom);
      e.stopPropagation();
    }
  });
  document.addEventListener('click', function(e){if(!e.target.closest('.tile')) hideTip();});
  var sp = $('spectrum');
  sp.addEventListener('pointermove', function(e){var s = e.target.closest('.sseg'); if(s) showTip(segHtml(+s.dataset.s), e.clientX, e.clientY); else hideTip();});
  sp.addEventListener('pointerleave', hideTip);
  sp.addEventListener('click', function(e){var s = e.target.closest('.sseg'); if(s) toggleStyle(+s.dataset.s);});
  sp.addEventListener('focusin', function(e){var s = e.target.closest('.sseg'); if(s){var r = s.getBoundingClientRect(); showTip(segHtml(+s.dataset.s), r.left, r.bottom);}});
  sp.addEventListener('focusout', hideTip);
  $('fleg').addEventListener('click', function(e){var f = e.target.closest('.fitem'); if(f) toggleFam(+f.dataset.f);});
  $('noticeBtn').addEventListener('click', function(){setStyle(U);});

  $('q').addEventListener('input', function(e){state.q = e.target.value; state.shown = 60; renderTable();});
  $('fFam').addEventListener('change', function(e){var v = e.target.value; state.fam = v==='all'?null:+v; state.style = null; state.shown = 60; refreshSelection();});
  $('fSty').addEventListener('change', function(e){var v = e.target.value; state.style = v==='all'?null:+v; state.fam = null; state.shown = 60; refreshSelection();});
  $('fVer').addEventListener('change', function(e){state.ver = e.target.value; state.shown = 60; renderTable();});
  $('fConf').addEventListener('change', function(e){state.conf = e.target.value; state.shown = 60; renderTable();});
  $('thead').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    var k = b.dataset.k;
    if(state.sortKey!==k){state.sortKey = k; state.sortDir = 1;}
    else if(state.sortDir===1){state.sortDir = -1;}
    else {state.sortKey = null; state.sortDir = 1;}
    renderHead(); renderTable();
  });
  $('more').addEventListener('click', function(e){if(e.target.id==='moreBtn'){state.shown += 60; renderTable();}});
  $('tclear').addEventListener('click', function(){setStyle(null);});
  $('tgo').addEventListener('click', function(){$('explorer').scrollIntoView({behavior: reduce?'auto':'smooth', block:'start'});});
  document.addEventListener('keydown', function(e){if(e.key==='Escape'){hideTip(); if(state.style!==null||state.fam!==null){state.style=null; state.fam=null; refreshSelection();}}});
  window.addEventListener('resize', hideTip);
  window.addEventListener('scroll', hideTip, {passive:true});

  // data source controls
  $('reload').addEventListener('click', function(){$('status').textContent = 'Reloading…'; fetchData(true);});
  var pick = function(){$('fileIn').click();};
  $('openFile').addEventListener('click', pick); $('gateOpen').addEventListener('click', pick);
  $('fileIn').addEventListener('change', function(e){if(e.target.files[0]) openLocal(e.target.files[0]); e.target.value = '';});
  var drag = 0;
  window.addEventListener('dragenter', function(e){e.preventDefault(); drag++; document.body.classList.add('dragging');});
  window.addEventListener('dragover', function(e){e.preventDefault();});
  window.addEventListener('dragleave', function(){drag = Math.max(0,drag-1); if(!drag) document.body.classList.remove('dragging');});
  window.addEventListener('drop', function(e){e.preventDefault(); drag = 0; document.body.classList.remove('dragging'); var f = e.dataTransfer.files[0]; if(f) openLocal(f);});
  // poll for a new version while the tab is visible
  setInterval(function(){ if(source==='site' && !document.hidden && tracks.length) fetchData(false); }, POLL_MS);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && source==='site' && tracks.length) fetchData(false); });
}

wire();
fetchData(true);
})();
</script>
